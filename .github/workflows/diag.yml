name: diag
on: workflow_dispatch

jobs:
  gosom-windows-matrix:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build and run isolated gosom matrix
        shell: pwsh
        run: ./gosom_windows_fix/run_matrix.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosom-windows-matrix
          path: gosom_windows_fix/results
