# 推一个 v* 标签 -> GitHub 免费 Windows 机器：打包 -> 静默安装 -> 真跑 1 格 -> 过了才发布 Release（安装程序 + app.zip）。
# 只是推代码（不打标签）时：只打包和测试，不发布。PLAN v1.4 第 4 步。
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: 标签和 VERSION 必须一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: if ("v$((Get-Content VERSION -Raw).Trim())" -ne "${{ github.ref_name }}") { throw "VERSION 和标签不一致" }
      - name: 打包零件
        shell: pwsh
        run: ./build/build.ps1
      - name: 做安装程序
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { throw 'innosetup install failed' } }
          & $iscc "/DAppVer=$v" build\installer.iss
          if ($LASTEXITCODE) { throw 'iscc failed' }
      - name: 静默安装 + 真跑 1 格（不登录 WhatsApp）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/DIR=C:\WLT' -Wait
          $env:WAT_HOME = "$env:LOCALAPPDATA\WhatsApp客户提取"
          $env:WAT_NODE = 'C:\WLT\node\node.exe'
          $env:WAT_NODE_MODULES = 'C:\WLT\node_modules'
          $env:WAT_GOSOM = 'C:\WLT\gosom\gosom-1.18.1-winargs.exe'
          $env:PLAYWRIGHT_DRIVER_PATH = 'C:\WLT\pw-driver'
          $env:PLAYWRIGHT_BROWSERS_PATH = 'C:\WLT\browsers'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:WAT_VERBOSE = '1'   # 把 gosom 自己的输出打出来，出错时看得到原因
          if (-not (Test-Path 'C:\WLT\pw-driver')) { throw 'gosom 驱动没装进去' }
          & C:\WLT\python\python.exe -c "import webview, crawl4ai, flask, openpyxl; print('imports ok')"
          if ($LASTEXITCODE) { throw 'imports failed' }
          # 瘦身后官网查找已知答案：hekede.co.uk 上写着 WhatsApp +8613629782814（Mac 10-20 实测）
          Set-Content -Encoding utf8 site_in.csv "place_id,website`nT1,https://hekede.co.uk/"
          & C:\WLT\python\python.exe -c "import sys,asyncio;sys.path.insert(0,r'C:\WLT\app_builtin\web');import find_wa;asyncio.run(find_wa.main('site_in.csv','site_out.csv','GB'))"
          if (-not (Select-String -Path site_out.csv -Pattern '8613629782814' -Quiet)) { Get-Content site_out.csv; throw '瘦身后官网查找没找到 hekede 的 WhatsApp' }
          # 3 格 London#1-3：Mac 实测 #1=0 家、#2=2 家，所以必须抓到 >0 家才算谷歌地图在 Windows 上真能用
          & C:\WLT\python\python.exe C:\WLT\app_builtin\app\pipeline.py --keywords "chinese supermarket" --country GB --cells 3 | Tee-Object -Variable out
          if ($LASTEXITCODE -gt 2) { throw "pipeline exit $LASTEXITCODE" }
          $done = ($out | Select-String 'DONE (.*)').Matches[0].Groups[1].Value | ConvertFrom-Json
          if ($done.businesses -lt 1) { throw "谷歌地图 0 家：Windows 上地图这一步没真跑通" }
          if (-not ($out | Select-String 'engine=gosom')) { throw '没有用 gosom 引擎' }
          if ($out | Select-String 'Downloading driver|Downloading Chrome') { throw '第一次运行还在从网上下载驱动/浏览器' }
          $x = Get-ChildItem "$env:USERPROFILE\Documents\WhatsApp客户提取\表格\*.xlsx"
          if (-not $x) { throw '没有生成 Excel' }
          Write-Host "OK: $($done.businesses) 家, Excel $($x.Name)"
          # gosom 的浏览器放在哪（判断客户第一次运行要不要从国外下载）
          foreach ($d in 'C:\WLT\browsers', "$env:LOCALAPPDATA\ms-playwright", "$env:LOCALAPPDATA\ms-playwright-go", "$env:USERPROFILE\AppData\Local\ms-playwright-go") {
            if (Test-Path $d) { Get-ChildItem $d -Directory | ForEach-Object { Write-Host "BROWSER $d\$($_.Name)" } } }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/app.zip
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/app.zip
